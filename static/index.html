<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0b0d12">
  <title>AI Chat</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #0b0d12;
      --panel: #11141b;
      --panel-raised: #171b24;
      --hover: #1c212c;
      --border: rgba(255, 255, 255, .07);
      --border-strong: rgba(255, 255, 255, .12);
      --text: #e9ebf1;
      --text-soft: #c3c8d4;
      --muted: #8a90a0;
      --faint: #5c6273;
      --accent: #3f7dfc;
      --accent-strong: #2f69e6;
      --accent-glow: rgba(63, 125, 252, .28);
      --danger: #f09191;
      --sidebar-width: 272px;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: var(--text);
      background: var(--bg);
      font-synthesis: none;
      text-rendering: optimizeLegibility;
    }

    * { box-sizing: border-box; }
    [hidden] { display: none !important; }

    body {
      margin: 0;
      min-width: 280px;
      height: 100vh;
      height: 100dvh;
      overflow: hidden;
      background: var(--bg);
    }

    button, textarea, input { font: inherit; }
    button { -webkit-tap-highlight-color: transparent; }
    button:focus-visible, textarea:focus-visible, input:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 2px;
    }

    .icon { width: 18px; height: 18px; flex: none; }

    /* ---------- Layout ---------- */
    .shell {
      height: 100%;
      display: grid;
      grid-template-columns: var(--sidebar-width) minmax(0, 1fr);
      gap: 12px;
      padding: 12px;
    }

    .shell.sidebar-collapsed { grid-template-columns: minmax(0, 1fr); }
    .shell.sidebar-collapsed .sidebar { display: none; }

    /* ---------- Sidebar ---------- */
    .sidebar {
      min-height: 0;
      display: flex;
      flex-direction: column;
      gap: 6px;
      padding: 14px 12px;
      border: 1px solid var(--border);
      border-radius: 18px;
      background: var(--panel);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 2px 4px 14px;
      border-bottom: 1px solid var(--border);
      margin-bottom: 8px;
    }

    .brand-mark {
      width: 30px;
      height: 30px;
      flex: none;
      display: grid;
      place-items: center;
      border-radius: 50%;
      color: #fff;
      background: radial-gradient(circle at 30% 25%, #8fb4ff, var(--accent) 55%, #2443a8);
      box-shadow: 0 0 18px var(--accent-glow);
    }

    .brand-mark .icon { width: 15px; height: 15px; }

    .brand-name {
      flex: 1;
      margin: 0;
      font-size: 18px;
      font-weight: 650;
      letter-spacing: -0.02em;
    }

    .icon-button {
      width: 32px;
      height: 32px;
      flex: none;
      display: grid;
      place-items: center;
      padding: 0;
      border: 0;
      border-radius: 9px;
      color: var(--muted);
      background: transparent;
      cursor: pointer;
    }

    .icon-button:hover { color: var(--text); background: var(--hover); }

    .new-chat-button {
      width: 100%;
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 12px;
      border: 1px solid rgba(63, 125, 252, .55);
      border-radius: 11px;
      color: var(--text);
      background: linear-gradient(90deg, rgba(63, 125, 252, .08), rgba(63, 125, 252, .30));
      box-shadow: inset 0 0 18px rgba(63, 125, 252, .10);
      font-size: 14px;
      font-weight: 550;
      text-align: left;
      cursor: pointer;
      transition: background 140ms ease;
    }

    .new-chat-button:hover {
      background: linear-gradient(90deg, rgba(63, 125, 252, .14), rgba(63, 125, 252, .40));
    }

    .sidebar-section {
      min-height: 0;
      display: flex;
      flex-direction: column;
      padding-top: 14px;
    }

    .sidebar-section.chats {
      flex: 1;
      border-top: 1px solid var(--border);
      margin-top: 8px;
    }

    .sidebar-section h2 {
      margin: 0 0 6px;
      padding: 0 6px;
      color: var(--faint);
      font-size: 11px;
      font-weight: 650;
      letter-spacing: .07em;
      text-transform: uppercase;
    }

    .sidebar-list {
      min-height: 0;
      display: grid;
      align-content: start;
      gap: 2px;
      overflow-y: auto;
      margin: 0;
      padding: 0;
      list-style: none;
      scrollbar-width: thin;
      scrollbar-color: var(--hover) transparent;
    }

    #document-list { max-height: 168px; }

    .document-row {
      display: grid;
      grid-template-columns: 18px minmax(0, 1fr) 28px;
      align-items: center;
      gap: 8px;
      padding: 5px 4px 5px 8px;
      border-radius: 9px;
      color: var(--text-soft);
      font-size: 13px;
    }

    .document-row:hover { background: var(--hover); }
    .document-row input { width: 15px; height: 15px; margin: 0; accent-color: var(--accent); }
    .document-name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

    .delete-document {
      width: 28px;
      height: 28px;
      display: grid;
      place-items: center;
      padding: 0;
      border: 0;
      border-radius: 8px;
      color: var(--faint);
      background: transparent;
      cursor: pointer;
    }

    .delete-document .icon { width: 15px; height: 15px; }
    .delete-document:hover { color: var(--danger); background: rgba(240, 145, 145, .10); }

    .conversation-button {
      width: 100%;
      overflow: hidden;
      padding: 9px 10px;
      border: 0;
      border-radius: 9px;
      color: var(--muted);
      background: transparent;
      font-size: 13.5px;
      text-align: left;
      text-overflow: ellipsis;
      white-space: nowrap;
      cursor: pointer;
    }

    .conversation-button:hover { color: var(--text); background: var(--hover); }
    .conversation-button.active { color: var(--text); background: var(--panel-raised); }
    .library-empty { padding: 6px 10px; color: var(--faint); font-size: 12.5px; }

    .sidebar-overlay { display: none; }

    /* ---------- Main ---------- */
    .main {
      min-width: 0;
      min-height: 0;
      display: flex;
      flex-direction: column;
      border: 1px solid var(--border);
      border-radius: 18px;
      background: var(--panel);
      overflow: hidden;
    }

    .main-header {
      height: 60px;
      flex: 0 0 60px;
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 0 18px;
      border-bottom: 1px solid var(--border);
    }

    .menu-button { display: none; }
    .shell.sidebar-collapsed .menu-button { display: grid; }

    .chat-title {
      min-width: 0;
      margin: 0;
      overflow: hidden;
      font-size: 17px;
      font-weight: 600;
      letter-spacing: -0.01em;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .feed {
      --gutter: max(18px, calc((100% - 760px) / 2));
      flex: 1;
      min-height: 0;
      overflow-y: auto;
      padding: 28px var(--gutter) 24px;
      display: flex;
      flex-direction: column;
      gap: 20px;
      scrollbar-width: thin;
      scrollbar-color: var(--hover) transparent;
    }

    .empty-state {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 24px 12px 40px;
    }

    .orb {
      position: relative;
      width: 128px;
      height: 128px;
      margin: 0 0 28px;
      border-radius: 50%;
      background: radial-gradient(circle at 35% 30%, #a9c4ff 0%, #4f86ff 38%, #2b3fb0 72%, #1a1f52 100%);
      box-shadow: 0 0 70px rgba(63, 125, 252, .35);
      filter: blur(.5px);
    }

    .orb::after {
      content: "";
      position: absolute;
      inset: 14px 26px auto auto;
      width: 44px;
      height: 44px;
      border-radius: 50%;
      background: rgba(214, 228, 255, .55);
      filter: blur(10px);
    }

    .empty-state h2 {
      margin: 0 0 8px;
      font-size: 20px;
      font-weight: 600;
      letter-spacing: -0.02em;
    }

    .empty-state p {
      max-width: 360px;
      margin: 0;
      color: var(--muted);
      font-size: 14px;
      line-height: 1.65;
    }

    .message {
      white-space: pre-wrap;
      overflow-wrap: anywhere;
      line-height: 1.65;
      font-size: 15px;
    }

    .message.user {
      align-self: flex-end;
      max-width: 82%;
      padding: 11px 16px;
      border-radius: 18px 18px 6px 18px;
      color: var(--text);
      background: var(--panel-raised);
      border: 1px solid var(--border);
    }

    .assistant-message { align-self: stretch; }
    .message.assistant { color: var(--text-soft); }

    .citations {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      padding-top: 10px;
    }

    .citation {
      padding: 4px 10px;
      border: 1px solid rgba(63, 125, 252, .30);
      border-radius: 999px;
      color: #a9c2ff;
      background: rgba(63, 125, 252, .10);
      font-size: 12px;
      line-height: 1.35;
    }

    .message-actions { display: flex; gap: 2px; padding-top: 8px; margin-left: -6px; }
    .message-actions .icon-button { width: 30px; height: 30px; color: var(--faint); }
    .message-actions .icon-button:hover { color: var(--text); }
    .message-actions .icon { width: 16px; height: 16px; }

    .system-note {
      align-self: center;
      max-width: 95%;
      color: var(--muted);
      text-align: center;
      font-size: 12.5px;
      line-height: 1.5;
      overflow-wrap: anywhere;
    }

    .composer-wrap {
      --gutter: max(18px, calc((100% - 760px) / 2));
      padding: 6px var(--gutter) max(18px, env(safe-area-inset-bottom));
    }

    .composer {
      padding: 12px;
      border: 1px solid var(--border-strong);
      border-radius: 20px;
      background: var(--panel-raised);
      transition: border-color 140ms ease;
    }

    .composer:focus-within { border-color: rgba(63, 125, 252, .55); }

    .composer textarea {
      display: block;
      width: 100%;
      min-height: 54px;
      max-height: 160px;
      resize: none;
      padding: 6px 8px 10px;
      border: 0;
      outline: 0;
      color: var(--text);
      background: transparent;
      font-size: 15px;
      line-height: 1.5;
    }

    .composer textarea::placeholder { color: var(--faint); }

    .composer-row {
      display: grid;
      grid-template-columns: 38px minmax(0, 1fr) 38px;
      align-items: center;
      gap: 10px;
    }

    .round-button {
      width: 38px;
      height: 38px;
      padding: 0;
      display: grid;
      place-items: center;
      border: 0;
      border-radius: 50%;
      cursor: pointer;
      transition: transform 120ms ease, opacity 120ms ease, background 140ms ease;
    }

    .round-button:hover { transform: translateY(-1px); }
    .round-button:disabled { cursor: wait; opacity: .45; transform: none; }

    .upload-button {
      border: 1px solid var(--border-strong);
      color: var(--text-soft);
      background: transparent;
    }

    .upload-button:hover { background: var(--hover); }

    .send-button { color: #fff; background: var(--accent); }
    .send-button:hover { background: var(--accent-strong); }

    .document-pill {
      min-width: 0;
      justify-self: start;
      max-width: 100%;
      overflow: hidden;
      padding: 7px 12px;
      border-radius: 999px;
      color: var(--muted);
      background: rgba(255, 255, 255, .04);
      font-size: 12px;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .visually-hidden {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }

    /* ---------- Phones and small tablets: sidebar becomes a drawer ---------- */
    @media (max-width: 820px) {
      .shell, .shell.sidebar-collapsed {
        grid-template-columns: minmax(0, 1fr);
        padding: 0;
        gap: 0;
      }

      .main { border: 0; border-radius: 0; }
      .main-header { padding: 0 12px; }
      .menu-button { display: grid; }

      .sidebar, .shell.sidebar-collapsed .sidebar {
        position: fixed;
        inset: 0 auto 0 0;
        z-index: 20;
        width: min(86vw, var(--sidebar-width));
        display: flex;
        border-radius: 0 18px 18px 0;
        transform: translateX(-102%);
        transition: transform 200ms ease;
      }

      .shell.sidebar-open .sidebar { transform: translateX(0); }

      .sidebar-overlay {
        position: fixed;
        inset: 0;
        z-index: 10;
        display: block;
        background: rgba(0, 0, 0, .55);
        opacity: 0;
        pointer-events: none;
        transition: opacity 200ms ease;
      }

      .shell.sidebar-open .sidebar-overlay { opacity: 1; pointer-events: auto; }
      .feed, .composer-wrap { --gutter: 16px; }
      .message.user { max-width: 90%; }
    }

    @media (prefers-reduced-motion: reduce) {
      * { transition: none !important; }
    }
  </style>
</head>
<body>
  <div class="shell" id="shell">
    <aside class="sidebar" id="sidebar" aria-label="Chats and documents">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true">
          <svg class="icon" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2.5l2.1 6.4 6.4 2.1-6.4 2.1L12 19.5l-2.1-6.4L3.5 11l6.4-2.1z"/></svg>
        </span>
        <h1 class="brand-name">AI Chat</h1>
        <button class="icon-button" id="sidebar-collapse" type="button" aria-label="Hide sidebar" title="Hide sidebar">
          <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <rect x="3.5" y="4.5" width="17" height="15" rx="3"/><path d="M9 4.5v15M15.5 10l-2 2 2 2"/>
          </svg>
        </button>
      </div>

      <button class="new-chat-button" id="clear-chat" type="button">
        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M20 12a8 8 0 0 1-11.6 7.1L4 20l1-4.1A8 8 0 1 1 20 12z"/><path d="M12 8.5v7M8.5 12h7"/>
        </svg>
        New chat
      </button>

      <section class="sidebar-section" aria-labelledby="documents-heading">
        <h2 id="documents-heading">Documents</h2>
        <ul class="sidebar-list" id="document-list"></ul>
      </section>

      <section class="sidebar-section chats" aria-labelledby="conversations-heading">
        <h2 id="conversations-heading">Chats</h2>
        <ul class="sidebar-list" id="conversation-list"></ul>
      </section>
    </aside>
    <div class="sidebar-overlay" id="sidebar-overlay" aria-hidden="true"></div>

    <main class="main">
      <header class="main-header">
        <button class="icon-button menu-button" id="sidebar-open" type="button" aria-label="Show sidebar" title="Show sidebar" aria-controls="sidebar">
          <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true">
            <path d="M4 7h16M4 12h16M4 17h10"/>
          </svg>
        </button>
        <h2 class="chat-title" id="chat-title">New chat</h2>
      </header>

      <section class="feed" id="feed" aria-live="polite" aria-label="Conversation">
        <div class="empty-state" id="empty-state">
          <div class="orb" aria-hidden="true"></div>
          <h2>Ask your documents</h2>
          <p>Upload a PDF, then ask it anything. Answers come only from your document, with citations.</p>
        </div>
      </section>

      <div class="composer-wrap">
        <form class="composer" id="composer">
          <label class="visually-hidden" for="question">Ask about your PDF...</label>
          <textarea id="question" rows="2" placeholder="Ask about your PDF..."></textarea>
          <div class="composer-row">
            <input class="visually-hidden" id="file-input" type="file" accept="application/pdf" multiple>
            <button class="round-button upload-button" id="upload-button" type="button" aria-label="Upload a PDF" title="Upload a PDF">
              <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
            </button>
            <div class="document-pill" id="document-pill">Upload a PDF to start</div>
            <button class="round-button send-button" id="send-button" type="submit" aria-label="Send question">
              <svg class="icon" viewBox="0 0 24 24" fill="none" aria-hidden="true">
                <path d="M12 19V5m0 0L6.5 10.5M12 5l5.5 5.5" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
              </svg>
            </button>
          </div>
        </form>
      </div>
    </main>
  </div>

  <script>
    (() => {
      const shell = document.querySelector("#shell");
      const feed = document.querySelector("#feed");
      const emptyState = document.querySelector("#empty-state");
      const textarea = document.querySelector("#question");
      const form = document.querySelector("#composer");
      const fileInput = document.querySelector("#file-input");
      const uploadButton = document.querySelector("#upload-button");
      const sendButton = document.querySelector("#send-button");
      const documentPill = document.querySelector("#document-pill");
      const documentList = document.querySelector("#document-list");
      const conversationList = document.querySelector("#conversation-list");
      const chatTitle = document.querySelector("#chat-title");
      const mobileQuery = window.matchMedia("(max-width: 820px)");
      const conversationTitles = new Map();
      let currentConversationId = null;
      let waiting = false;
      let uploading = false;

      const COPY_ICON = '<svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" aria-hidden="true"><rect x="8.5" y="8.5" width="11" height="11" rx="2.5"/><path d="M15.5 8.5V6.5a2 2 0 0 0-2-2h-7a2 2 0 0 0-2 2v7a2 2 0 0 0 2 2h2"/></svg>';
      const CHECK_ICON = '<svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>';
      const TRASH_ICON = '<svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4.5 7h15M9.5 7V5h5v2M6.5 7l.8 12h9.4l.8-12M10 11v5M14 11v5"/></svg>';

      /* ---------- Sidebar ---------- */
      function readCollapsed() {
        try { return localStorage.getItem("sidebarCollapsed") === "1"; } catch { return false; }
      }

      function saveCollapsed(collapsed) {
        try { localStorage.setItem("sidebarCollapsed", collapsed ? "1" : "0"); } catch { /* storage unavailable */ }
      }

      function openSidebar() {
        if (mobileQuery.matches) {
          shell.classList.add("sidebar-open");
        } else {
          shell.classList.remove("sidebar-collapsed");
          saveCollapsed(false);
        }
      }

      function closeSidebar() {
        if (mobileQuery.matches) {
          shell.classList.remove("sidebar-open");
        } else {
          shell.classList.add("sidebar-collapsed");
          saveCollapsed(true);
        }
      }

      function closeDrawerOnMobile() {
        if (mobileQuery.matches) shell.classList.remove("sidebar-open");
      }

      if (readCollapsed()) shell.classList.add("sidebar-collapsed");
      document.querySelector("#sidebar-open").addEventListener("click", openSidebar);
      document.querySelector("#sidebar-collapse").addEventListener("click", closeSidebar);
      document.querySelector("#sidebar-overlay").addEventListener("click", closeDrawerOnMobile);
      document.addEventListener("keydown", (event) => {
        if (event.key === "Escape") closeDrawerOnMobile();
      });
      mobileQuery.addEventListener("change", () => shell.classList.remove("sidebar-open"));

      /* ---------- Feed ---------- */
      function setChatTitle(title) {
        chatTitle.textContent = title || "New chat";
        chatTitle.title = title || "";
      }

      function refreshEmptyState() {
        emptyState.hidden = feed.querySelector(".message, .system-note") !== null;
      }

      function scrollToLatest() {
        feed.scrollTop = feed.scrollHeight;
      }

      function addSystemNote(text) {
        const note = document.createElement("div");
        note.className = "system-note";
        note.textContent = text;
        feed.append(note);
        refreshEmptyState();
        scrollToLatest();
      }

      function addUserMessage(text) {
        const message = document.createElement("div");
        message.className = "message user";
        message.textContent = text;
        feed.append(message);
        refreshEmptyState();
        scrollToLatest();
      }

      function addCopyButton(container, message) {
        const actions = document.createElement("div");
        actions.className = "message-actions";
        const copyButton = document.createElement("button");
        copyButton.className = "icon-button";
        copyButton.type = "button";
        copyButton.innerHTML = COPY_ICON;
        copyButton.setAttribute("aria-label", "Copy answer");
        copyButton.title = "Copy answer";
        copyButton.addEventListener("click", async () => {
          try {
            await navigator.clipboard.writeText(message.textContent);
            copyButton.innerHTML = CHECK_ICON;
            copyButton.title = "Copied";
            setTimeout(() => {
              copyButton.innerHTML = COPY_ICON;
              copyButton.title = "Copy answer";
            }, 1500);
          } catch {
            addSystemNote("Could not copy to the clipboard.");
          }
        });
        actions.append(copyButton);
        container.append(actions);
      }

      function addAssistantMessage(answer, citations) {
        const wrapper = document.createElement("article");
        wrapper.className = "assistant-message";
        const message = document.createElement("div");
        message.className = "message assistant";
        message.textContent = answer
          .replace(/\[[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}\]/gi, "")
          .replace(/ {2,}/g, " ")
          .trim();
        wrapper.append(message);

        if (Array.isArray(citations) && citations.length > 0) {
          const citationList = document.createElement("div");
          citationList.className = "citations";
          for (const citation of citations) {
            const chip = document.createElement("span");
            chip.className = "citation";
            chip.textContent = `${citation.file} · p.${citation.page}`;
            citationList.append(chip);
          }
          wrapper.append(citationList);
        }

        addCopyButton(wrapper, message);
        feed.append(wrapper);
        refreshEmptyState();
        scrollToLatest();
      }

      function clearFeed() {
        for (const child of Array.from(feed.children)) {
          if (child !== emptyState) child.remove();
        }
        refreshEmptyState();
      }

      async function responseError(response) {
        try {
          const body = await response.json();
          return typeof body.detail === "string" ? body.detail : "The request failed.";
        } catch {
          return "The request failed.";
        }
      }

      /* ---------- Documents ---------- */
      function selectedDocumentIds() {
        return Array.from(documentList.querySelectorAll("input[type=checkbox]:checked"))
          .map((checkbox) => checkbox.value);
      }

      function updateDocumentPill() {
        const selected = selectedDocumentIds();
        const hasDocuments = documentList.querySelector("input[type=checkbox]") !== null;
        documentPill.textContent = selected.length
          ? `${selected.length} document${selected.length === 1 ? "" : "s"} selected`
          : hasDocuments ? "Select documents to ask" : "Upload a PDF to start";
      }

      async function loadDocuments() {
        const response = await fetch("/documents");
        if (!response.ok) throw new Error(await responseError(response));
        const documents = await response.json();
        documentList.replaceChildren();

        if (documents.length === 0) {
          const empty = document.createElement("li");
          empty.className = "library-empty";
          empty.textContent = "No documents yet";
          documentList.append(empty);
        }

        for (const item of documents) {
          const row = document.createElement("li");
          row.className = "document-row";

          const checkbox = document.createElement("input");
          checkbox.type = "checkbox";
          checkbox.value = item.id;
          checkbox.checked = true;
          checkbox.setAttribute("aria-label", `Use ${item.filename}`);
          checkbox.addEventListener("change", updateDocumentPill);

          const name = document.createElement("span");
          name.className = "document-name";
          name.textContent = item.filename;
          name.title = `${item.filename} · ${item.pages} pages`;

          const deleteButton = document.createElement("button");
          deleteButton.className = "delete-document";
          deleteButton.type = "button";
          deleteButton.innerHTML = TRASH_ICON;
          deleteButton.setAttribute("aria-label", `Delete ${item.filename}`);
          deleteButton.title = "Delete document";
          deleteButton.addEventListener("click", async () => {
            if (!window.confirm(`Delete ${item.filename}? This removes it and its cached answers.`)) return;
            deleteButton.disabled = true;
            try {
              const deleteResponse = await fetch(`/documents/${encodeURIComponent(item.id)}`, {
                method: "DELETE"
              });
              if (!deleteResponse.ok) throw new Error(await responseError(deleteResponse));
              await loadDocuments();
            } catch (error) {
              addSystemNote(error instanceof Error ? error.message : "The document could not be deleted.");
              deleteButton.disabled = false;
            }
          });

          row.append(checkbox, name, deleteButton);
          documentList.append(row);
        }
        updateDocumentPill();
      }

      /* ---------- Chats ---------- */
      function renderConversations(conversations) {
        conversationList.replaceChildren();
        conversationTitles.clear();
        if (conversations.length === 0) {
          const empty = document.createElement("li");
          empty.className = "library-empty";
          empty.textContent = "No chats yet";
          conversationList.append(empty);
          return;
        }

        for (const conversation of conversations) {
          conversationTitles.set(conversation.id, conversation.title);
          const row = document.createElement("li");
          const button = document.createElement("button");
          button.className = "conversation-button";
          if (conversation.id === currentConversationId) {
            button.classList.add("active");
            button.setAttribute("aria-current", "true");
          }
          button.type = "button";
          button.textContent = conversation.title;
          button.title = conversation.title;
          button.addEventListener("click", () => loadConversation(conversation.id));
          row.append(button);
          conversationList.append(row);
        }
      }

      async function loadConversations() {
        const response = await fetch("/conversations");
        if (!response.ok) throw new Error(await responseError(response));
        renderConversations(await response.json());
        if (currentConversationId) setChatTitle(conversationTitles.get(currentConversationId));
      }

      async function loadConversation(conversationId) {
        closeDrawerOnMobile();
        try {
          const response = await fetch(
            `/conversations/${encodeURIComponent(conversationId)}/messages`
          );
          if (!response.ok) throw new Error(await responseError(response));
          const messages = await response.json();
          currentConversationId = conversationId;
          setChatTitle(conversationTitles.get(conversationId));
          clearFeed();
          for (const message of messages) {
            if (message.role === "user") addUserMessage(message.content);
            else addAssistantMessage(message.content, message.citations);
          }
          await loadConversations();
        } catch (error) {
          addSystemNote(error instanceof Error ? error.message : "The conversation could not be loaded.");
        }
      }

      function startNewChat() {
        currentConversationId = null;
        setChatTitle(null);
        clearFeed();
        closeDrawerOnMobile();
        loadConversations().catch((error) => {
          addSystemNote(error instanceof Error ? error.message : "Chats could not be loaded.");
        });
        textarea.focus();
      }

      /* ---------- Upload and ask ---------- */
      uploadButton.addEventListener("click", () => fileInput.click());

      fileInput.addEventListener("change", async () => {
        const files = Array.from(fileInput.files || []);
        if (files.length === 0) return;

        uploading = true;
        uploadButton.disabled = true;
        documentPill.textContent = `Indexing ${files.length} file${files.length === 1 ? "" : "s"}…`;
        const formData = new FormData();
        for (const file of files) formData.append("files", file);

        try {
          const response = await fetch("/upload", { method: "POST", body: formData });
          if (!response.ok) throw new Error(await responseError(response));
          const result = await response.json();
          await loadDocuments();
          for (const document of result.documents) {
            addSystemNote(
              document.already_indexed
                ? `${document.filename} was already indexed.`
                : `Ready. Added ${document.filename} (${document.pages} pages).`
            );
          }
        } catch (error) {
          updateDocumentPill();
          addSystemNote(error instanceof Error ? error.message : "The upload failed.");
        } finally {
          uploading = false;
          uploadButton.disabled = false;
          fileInput.value = "";
        }
      });

      form.addEventListener("submit", async (event) => {
        event.preventDefault();
        if (waiting || uploading) return;
        const question = textarea.value.trim();
        if (!question) return;
        const docIds = selectedDocumentIds();
        if (docIds.length === 0) {
          addSystemNote("Select at least one document.");
          return;
        }

        addUserMessage(question);
        if (!currentConversationId) setChatTitle(question);
        textarea.value = "";
        textarea.style.height = "";
        waiting = true;
        sendButton.disabled = true;

        try {
          const response = await fetch("/ask", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              question,
              doc_ids: docIds,
              ...(currentConversationId ? { conversation_id: currentConversationId } : {})
            })
          });
          if (!response.ok) {
            throw new Error(await responseError(response));
          }
          const result = await response.json();
          currentConversationId = result.conversation_id;
          addAssistantMessage(result.answer, result.citations);
          await loadConversations();
        } catch (error) {
          addSystemNote(error instanceof Error ? error.message : "The question failed.");
        } finally {
          waiting = false;
          sendButton.disabled = false;
          textarea.focus();
        }
      });

      textarea.addEventListener("keydown", (event) => {
        if (event.key === "Enter" && !event.shiftKey) {
          event.preventDefault();
          form.requestSubmit();
        }
      });

      textarea.addEventListener("input", () => {
        textarea.style.height = "auto";
        textarea.style.height = `${Math.min(textarea.scrollHeight, 160)}px`;
      });

      document.querySelector("#clear-chat").addEventListener("click", startNewChat);

      loadDocuments().catch((error) => addSystemNote(error.message));
      loadConversations().catch((error) => addSystemNote(error.message));
    })();
  </script>
</body>
</html>
