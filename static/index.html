<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f2f3f7">
  <title>AI Chat</title>
  <style>
    :root {
      color-scheme: light;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: #20232b;
      background: #f2f3f7;
      font-synthesis: none;
      text-rendering: optimizeLegibility;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-width: 280px;
      min-height: 100vh;
      min-height: 100dvh;
      background: #f2f3f7;
    }

    button, textarea { font: inherit; }
    button { -webkit-tap-highlight-color: transparent; }

    .app {
      width: min(100%, 552px);
      min-height: 100vh;
      min-height: 100dvh;
      margin: 0 auto;
      padding: 0 16px;
      display: flex;
      flex-direction: column;
    }

    .topbar {
      height: 66px;
      flex: 0 0 66px;
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: center;
    }

    .new-chat-button {
      justify-self: start;
      height: 38px;
      padding: 0 14px 0 11px;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      border: 0;
      border-radius: 999px;
      color: #fff;
      background: #252831;
      font: inherit;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: transform 120ms ease;
    }

    .new-chat-button:hover { transform: translateY(-1px); }
    .new-chat-button svg { width: 17px; height: 17px; }

    .topbar h1 {
      margin: 0;
      text-align: center;
      font-size: 17px;
      font-weight: 650;
      letter-spacing: -0.02em;
    }

    .library {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      padding: 4px 0 8px;
    }

    .library-section {
      min-width: 0;
      padding: 10px 12px;
      border: 1px solid rgba(31, 35, 43, .06);
      border-radius: 15px;
      background: #fff;
    }

    .library-section h2 {
      margin: 0 0 7px;
      color: #777d87;
      font-size: 11px;
      font-weight: 650;
      letter-spacing: .04em;
      text-transform: uppercase;
    }

    .library-list {
      display: grid;
      max-height: 124px;
      gap: 5px;
      overflow-y: auto;
      margin: 0;
      padding: 0;
      list-style: none;
    }

    .document-row {
      display: grid;
      grid-template-columns: 18px minmax(0, 1fr) auto;
      align-items: center;
      gap: 6px;
      color: #454a55;
      font-size: 11px;
    }

    .document-row input { margin: 0; accent-color: #537b62; }
    .document-name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

    .delete-document {
      padding: 3px 6px;
      border: 0;
      border-radius: 7px;
      color: #8a5252;
      background: #f8eeee;
      font-size: 10px;
      cursor: pointer;
    }

    .conversation-button {
      width: 100%;
      overflow: hidden;
      padding: 5px 7px;
      border: 0;
      border-radius: 7px;
      color: #555b66;
      background: transparent;
      font-size: 11px;
      text-align: left;
      text-overflow: ellipsis;
      white-space: nowrap;
      cursor: pointer;
    }

    .conversation-button:hover, .conversation-button.active { background: #f1f2f5; }
    .library-empty { color: #a0a4ad; font-size: 11px; }

    .round-button {
      width: 40px;
      height: 40px;
      padding: 0;
      display: grid;
      place-items: center;
      border: 0;
      border-radius: 50%;
      color: #fff;
      background: #252831;
      cursor: pointer;
      transition: transform 120ms ease, opacity 120ms ease;
    }

    .round-button:hover { transform: translateY(-1px); }
    .round-button:disabled { cursor: wait; opacity: .48; transform: none; }
    .round-button svg { width: 19px; height: 19px; }

    .feed {
      flex: 1;
      min-height: 180px;
      overflow-y: auto;
      padding: 8px 0 24px;
      display: flex;
      flex-direction: column;
      gap: 14px;
      scrollbar-width: thin;
    }

    .empty-state {
      flex: 1;
      min-height: 360px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 24px 12px 52px;
    }

    .orb {
      position: relative;
      width: 142px;
      height: 142px;
      margin: 0 0 28px;
      border-radius: 50%;
      background: linear-gradient(145deg, #d4efcf 8%, #a9debd 48%, #caeee1 100%);
      filter: blur(1px);
      box-shadow: 0 18px 58px rgba(111, 183, 142, .25);
    }

    .orb::before, .orb::after {
      content: "";
      position: absolute;
      border-radius: 50%;
      filter: blur(8px);
    }

    .orb::before {
      width: 72px;
      height: 72px;
      top: 8px;
      right: -9px;
      background: rgba(224, 248, 219, .84);
    }

    .orb::after {
      width: 90px;
      height: 72px;
      bottom: 1px;
      left: -12px;
      background: rgba(139, 211, 171, .56);
    }

    .empty-state p {
      max-width: 350px;
      margin: 0;
      color: #717681;
      font-size: 14px;
      line-height: 1.65;
    }

    .message {
      max-width: 88%;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
      line-height: 1.55;
      font-size: 14px;
    }

    .message.user {
      align-self: flex-end;
      padding: 11px 15px;
      border-radius: 18px 18px 5px 18px;
      color: #fff;
      background: #292c35;
    }

    .assistant-message {
      align-self: flex-start;
      max-width: 94%;
    }

    .message.assistant {
      padding: 13px 15px;
      border: 1px solid rgba(32, 35, 43, .04);
      border-radius: 17px 17px 17px 5px;
      color: #292c35;
      background: #fff;
      box-shadow: 0 5px 18px rgba(40, 45, 59, .045);
    }

    .citations {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      padding: 8px 2px 0;
    }

    .citation {
      padding: 4px 9px;
      border: 1px solid #dfe6df;
      border-radius: 999px;
      color: #536b5c;
      background: #edf5ee;
      font-size: 11px;
      line-height: 1.35;
    }

    .system-note {
      align-self: center;
      max-width: 95%;
      color: #858a94;
      text-align: center;
      font-size: 12px;
      line-height: 1.5;
      overflow-wrap: anywhere;
    }

    .composer-wrap {
      position: sticky;
      bottom: 0;
      padding: 8px 0 max(14px, env(safe-area-inset-bottom));
      background: linear-gradient(to bottom, rgba(242, 243, 247, 0), #f2f3f7 18px);
    }

    .composer {
      padding: 12px;
      border: 1px solid rgba(31, 35, 43, .06);
      border-radius: 23px;
      background: #fff;
      box-shadow: 0 10px 32px rgba(30, 36, 48, .09);
    }

    .composer textarea {
      display: block;
      width: 100%;
      min-height: 54px;
      max-height: 160px;
      resize: none;
      padding: 7px 8px 10px;
      border: 0;
      outline: 0;
      color: #252831;
      background: transparent;
      font-size: 14px;
      line-height: 1.5;
    }

    .composer textarea::placeholder { color: #a0a4ad; }
    .composer-row {
      display: grid;
      grid-template-columns: 40px minmax(0, 1fr) 40px;
      align-items: center;
      gap: 10px;
    }

    .upload-button {
      border: 1px solid #e8e9ed;
      color: #353943;
      background: #f8f8fa;
    }

    .upload-button span {
      margin-top: -2px;
      font-size: 25px;
      font-weight: 350;
      line-height: 1;
    }

    .document-pill {
      min-width: 0;
      overflow: hidden;
      padding: 8px 12px;
      border-radius: 999px;
      color: #777d87;
      background: #f1f2f5;
      font-size: 11px;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .send-button { width: 40px; height: 40px; }
    .send-button svg { width: 18px; height: 18px; }
    .visually-hidden {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }

    @media (max-width: 380px) {
      .app { padding-right: 16px; padding-left: 16px; }
      .composer { padding: 10px; }
      .composer-row { gap: 8px; }
    }
  </style>
</head>
<body>
  <main class="app">
    <header class="topbar">
      <button class="new-chat-button" id="clear-chat" type="button">
        <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
        </svg>
        New chat
      </button>
      <h1>AI Chat</h1>
      <span aria-hidden="true"></span>
    </header>

    <div class="library">
      <section class="library-section" aria-labelledby="documents-heading">
        <h2 id="documents-heading">Documents</h2>
        <ul class="library-list" id="document-list"></ul>
      </section>
      <section class="library-section" aria-labelledby="conversations-heading">
        <h2 id="conversations-heading">Conversations</h2>
        <ul class="library-list" id="conversation-list"></ul>
      </section>
    </div>

    <section class="feed" id="feed" aria-live="polite" aria-label="Conversation">
      <div class="empty-state" id="empty-state">
        <div class="orb" aria-hidden="true"></div>
        <p>Upload a PDF, then ask it anything. Answers come only from your document, with citations.</p>
      </div>
    </section>

    <div class="composer-wrap">
      <form class="composer" id="composer">
        <label class="visually-hidden" for="question">Ask about your PDF...</label>
        <textarea id="question" rows="2" placeholder="Ask about your PDF..."></textarea>
        <div class="composer-row">
          <input class="visually-hidden" id="file-input" type="file" accept="application/pdf" multiple>
          <button class="round-button upload-button" id="upload-button" type="button" aria-label="Upload a PDF">
            <span aria-hidden="true">+</span>
          </button>
          <div class="document-pill" id="document-pill">Upload a PDF to start</div>
          <button class="round-button send-button" id="send-button" type="submit" aria-label="Send question">
            <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
              <path d="M12 19V5m0 0L6.5 10.5M12 5l5.5 5.5" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
          </button>
        </div>
      </form>
    </div>
  </main>

  <script>
    (() => {
      const feed = document.querySelector("#feed");
      const emptyState = document.querySelector("#empty-state");
      const textarea = document.querySelector("#question");
      const form = document.querySelector("#composer");
      const fileInput = document.querySelector("#file-input");
      const uploadButton = document.querySelector("#upload-button");
      const sendButton = document.querySelector("#send-button");
      const documentPill = document.querySelector("#document-pill");
      const documentList = document.querySelector("#document-list");
      const conversationList = document.querySelector("#conversation-list");
      let currentConversationId = null;
      let waiting = false;
      let uploading = false;

      function refreshEmptyState() {
        emptyState.hidden = feed.querySelector(".message, .system-note") !== null;
      }

      function scrollToLatest() {
        feed.scrollTop = feed.scrollHeight;
      }

      function addSystemNote(text) {
        const note = document.createElement("div");
        note.className = "system-note";
        note.textContent = text;
        feed.append(note);
        refreshEmptyState();
        scrollToLatest();
      }

      function addUserMessage(text) {
        const message = document.createElement("div");
        message.className = "message user";
        message.textContent = text;
        feed.append(message);
        refreshEmptyState();
        scrollToLatest();
      }

      function addAssistantMessage(answer, citations) {
        const wrapper = document.createElement("article");
        wrapper.className = "assistant-message";
        const message = document.createElement("div");
        message.className = "message assistant";
        message.textContent = answer
          .replace(/\[[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}\]/gi, "")
          .replace(/ {2,}/g, " ")
          .trim();
        wrapper.append(message);

        if (Array.isArray(citations) && citations.length > 0) {
          const citationList = document.createElement("div");
          citationList.className = "citations";
          for (const citation of citations) {
            const chip = document.createElement("span");
            chip.className = "citation";
            chip.textContent = `${citation.file} · p.${citation.page}`;
            citationList.append(chip);
          }
          wrapper.append(citationList);
        }

        feed.append(wrapper);
        refreshEmptyState();
        scrollToLatest();
      }

      function clearFeed() {
        for (const child of Array.from(feed.children)) {
          if (child !== emptyState) child.remove();
        }
        refreshEmptyState();
      }

      async function responseError(response) {
        try {
          const body = await response.json();
          return typeof body.detail === "string" ? body.detail : "The request failed.";
        } catch {
          return "The request failed.";
        }
      }

      function selectedDocumentIds() {
        return Array.from(documentList.querySelectorAll("input[type=checkbox]:checked"))
          .map((checkbox) => checkbox.value);
      }

      function updateDocumentPill() {
        const selected = selectedDocumentIds();
        const hasDocuments = documentList.querySelector("input[type=checkbox]") !== null;
        documentPill.textContent = selected.length
          ? `${selected.length} document${selected.length === 1 ? "" : "s"} selected`
          : hasDocuments ? "Select documents to ask" : "Upload a PDF to start";
      }

      async function loadDocuments() {
        const response = await fetch("/documents");
        if (!response.ok) throw new Error(await responseError(response));
        const documents = await response.json();
        documentList.replaceChildren();

        if (documents.length === 0) {
          const empty = document.createElement("li");
          empty.className = "library-empty";
          empty.textContent = "No documents yet";
          documentList.append(empty);
        }

        for (const item of documents) {
          const row = document.createElement("li");
          row.className = "document-row";

          const checkbox = document.createElement("input");
          checkbox.type = "checkbox";
          checkbox.value = item.id;
          checkbox.checked = true;
          checkbox.setAttribute("aria-label", `Use ${item.filename}`);
          checkbox.addEventListener("change", updateDocumentPill);

          const name = document.createElement("span");
          name.className = "document-name";
          name.textContent = item.filename;
          name.title = `${item.filename} · ${item.pages} pages`;

          const deleteButton = document.createElement("button");
          deleteButton.className = "delete-document";
          deleteButton.type = "button";
          deleteButton.textContent = "Delete";
          deleteButton.setAttribute("aria-label", `Delete ${item.filename}`);
          deleteButton.addEventListener("click", async () => {
            deleteButton.disabled = true;
            try {
              const deleteResponse = await fetch(`/documents/${encodeURIComponent(item.id)}`, {
                method: "DELETE"
              });
              if (!deleteResponse.ok) throw new Error(await responseError(deleteResponse));
              await loadDocuments();
            } catch (error) {
              addSystemNote(error instanceof Error ? error.message : "The document could not be deleted.");
              deleteButton.disabled = false;
            }
          });

          row.append(checkbox, name, deleteButton);
          documentList.append(row);
        }
        updateDocumentPill();
      }

      function renderConversations(conversations) {
        conversationList.replaceChildren();
        if (conversations.length === 0) {
          const empty = document.createElement("li");
          empty.className = "library-empty";
          empty.textContent = "No conversations yet";
          conversationList.append(empty);
          return;
        }

        for (const conversation of conversations) {
          const row = document.createElement("li");
          const button = document.createElement("button");
          button.className = "conversation-button";
          if (conversation.id === currentConversationId) button.classList.add("active");
          button.type = "button";
          button.textContent = conversation.title;
          button.title = conversation.title;
          button.addEventListener("click", () => loadConversation(conversation.id));
          row.append(button);
          conversationList.append(row);
        }
      }

      async function loadConversations() {
        const response = await fetch("/conversations");
        if (!response.ok) throw new Error(await responseError(response));
        renderConversations(await response.json());
      }

      async function loadConversation(conversationId) {
        try {
          const response = await fetch(
            `/conversations/${encodeURIComponent(conversationId)}/messages`
          );
          if (!response.ok) throw new Error(await responseError(response));
          const messages = await response.json();
          currentConversationId = conversationId;
          clearFeed();
          for (const message of messages) {
            if (message.role === "user") addUserMessage(message.content);
            else addAssistantMessage(message.content, message.citations);
          }
          await loadConversations();
        } catch (error) {
          addSystemNote(error instanceof Error ? error.message : "The conversation could not be loaded.");
        }
      }

      uploadButton.addEventListener("click", () => fileInput.click());

      fileInput.addEventListener("change", async () => {
        const files = Array.from(fileInput.files || []);
        if (files.length === 0) return;

        uploading = true;
        uploadButton.disabled = true;
        documentPill.textContent = `Indexing ${files.length} file${files.length === 1 ? "" : "s"}…`;
        const formData = new FormData();
        for (const file of files) formData.append("files", file);

        try {
          const response = await fetch("/upload", { method: "POST", body: formData });
          if (!response.ok) throw new Error(await responseError(response));
          const result = await response.json();
          await loadDocuments();
          for (const document of result.documents) {
            addSystemNote(
              document.already_indexed
                ? `${document.filename} was already indexed.`
                : `Ready. Added ${document.filename} (${document.pages} pages).`
            );
          }
        } catch (error) {
          updateDocumentPill();
          addSystemNote(error instanceof Error ? error.message : "The upload failed.");
        } finally {
          uploading = false;
          uploadButton.disabled = false;
          fileInput.value = "";
        }
      });

      form.addEventListener("submit", async (event) => {
        event.preventDefault();
        if (waiting || uploading) return;
        const question = textarea.value.trim();
        if (!question) return;
        const docIds = selectedDocumentIds();
        if (docIds.length === 0) {
          addSystemNote("Select at least one document.");
          return;
        }

        addUserMessage(question);
        textarea.value = "";
        textarea.style.height = "";
        waiting = true;
        sendButton.disabled = true;

        try {
          const response = await fetch("/ask", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              question,
              doc_ids: docIds,
              ...(currentConversationId ? { conversation_id: currentConversationId } : {})
            })
          });
          if (!response.ok) {
            throw new Error(await responseError(response));
          }
          const result = await response.json();
          currentConversationId = result.conversation_id;
          addAssistantMessage(result.answer, result.citations);
          await loadConversations();
        } catch (error) {
          addSystemNote(error instanceof Error ? error.message : "The question failed.");
        } finally {
          waiting = false;
          sendButton.disabled = false;
          textarea.focus();
        }
      });

      textarea.addEventListener("keydown", (event) => {
        if (event.key === "Enter" && !event.shiftKey) {
          event.preventDefault();
          form.requestSubmit();
        }
      });

      textarea.addEventListener("input", () => {
        textarea.style.height = "auto";
        textarea.style.height = `${Math.min(textarea.scrollHeight, 160)}px`;
      });

      document.querySelector("#clear-chat").addEventListener("click", () => {
        currentConversationId = null;
        clearFeed();
        loadConversations().catch((error) => {
          addSystemNote(error instanceof Error ? error.message : "Conversations could not be loaded.");
        });
      });

      loadDocuments().catch((error) => addSystemNote(error.message));
      loadConversations().catch((error) => addSystemNote(error.message));
    })();
  </script>
</body>
</html>
