# RAG Pipeline Configuration
# Parameters from RAG_PIPELINE.md

[paths]
data_dir = "data"           # directory for document ingestion (watched folder)

[chunking]
chunk_size = 400      # tokens (default: 400, tuned on EVAL.md)
overlap = 50           # tokens (default: 50, tuned on EVAL.md)

[retrieval]
method = "hybrid"           # "hybrid" (BM25 + vector, fused with RRF) or "keyword" (BM25 only)
engine = "custom"           # hybrid only: "custom" (src.index + src.fuse) or "langchain" (src/lc_retrieve.py: BM25Retriever + pgvector, EnsembleRetriever)
top_n_per_retriever = 20    # default: 20 (candidates each for BM25 and vector search)

[fusion]
rrf_k = 60                  # default: 60 (RRF constant: score(d) = Σ 1 / (k + rank_i(d)))

[reranking]
rerank_top_n = 20           # default: 20 (fused candidates passed to reranker)
rerank_keep = 5             # default: 5 (candidates kept for generation)

[thresholds]
# Chosen from eval/calibration.jsonl (vector top score, 15 answerable / 15 unanswerable). Not tuned on eval/questions.jsonl.
not_found_threshold = 0.605


[embedding]
model = "nomic-embed-text"
host = "http://127.0.0.1:11434"   # not "localhost": on Windows it tries IPv6 first, adding ~2 s per request
search_query_prefix = "search_query: "
search_document_prefix = "search_document: "


[generation]
top_k = 4
temperature = 0           # greedy decoding, so repeated eval runs give the same answers


[ollama]
model = "mistral"
host = "http://127.0.0.1:11434"   # not "localhost": on Windows it tries IPv6 first, adding ~2 s per request


[cache]
enabled = true              # answer cache in PostgreSQL; false skips it entirely
